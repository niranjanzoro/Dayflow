<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dayflow - Sign In</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #111111;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .signin-container {
            width: 370px;
            padding: 25px 35px;
            border: 2px solid #555;
            border-radius: 2px;
            background: #111111;
        }

        /* Logo */
        .logo {
            width: 190px;
            height: 45px;
            margin: 0 auto 45px;
            background: #202428;
            border-radius: 7px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #dddddd;
            font-size: 15px;
        }

        .title {
            text-align: center;
            font-size: 22px;
            margin-bottom: 30px;
            color: white;
        }

        /* Input group */
        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            margin-bottom: 8px;
            color: #dddddd;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper input {
            width: 100%;
            height: 38px;
            padding: 0 42px 0 12px;

            background: #181818;
            border: none;
            border-bottom: 1px solid #777;

            color: white;
            outline: none;
            font-size: 14px;
        }

        .input-wrapper input:focus {
            border-bottom: 2px solid #b34de0;
        }

        /* Password eye */
        .toggle-password {
            position: absolute;
            right: 8px;
            top: 8px;

            width: 25px;
            height: 22px;

            border: none;
            background: #eeeeee;
            color: #333;

            cursor: pointer;
            font-size: 13px;
        }

        /* Forgot password */
        .forgot {
            text-align: right;
            margin-top: -8px;
            margin-bottom: 25px;
        }

        .forgot a {
            color: #b34de0;
            text-decoration: none;
            font-size: 13px;
        }

        .forgot a:hover {
            text-decoration: underline;
        }

        /* Sign In button */
        .signin-btn {
            width: 100%;
            height: 40px;

            border: none;
            border-radius: 5px;

            background: #b34de0;
            color: #111;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;
            transition: 0.2s;
        }

        .signin-btn:hover {
            background: #c265e8;
            transform: translateY(-1px);
        }

        /* Sign Up */
        .signup-text {
            text-align: center;
            margin-top: 25px;
            font-size: 13px;
            color: #cccccc;
        }

        .signup-text a {
            color: #b34de0;
            text-decoration: none;
            font-weight: bold;
        }

        .signup-text a:hover {
            text-decoration: underline;
        }

        /* Error message */
        .error {
            color: #ff6b6b;
            font-size: 13px;
            margin-top: 10px;
            display: none;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="signin-container">

        <!-- App Logo -->
        <div class="logo">
            Dayflow
        </div>

        <!-- Title -->
        <div class="title">
            Sign In
        </div>

        <form id="signinForm">

            <!-- Email -->
            <div class="input-group">
                <label for="email">Email :</label>

                <div class="input-wrapper">
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>
            </div>

            <!-- Password -->
            <div class="input-group">
                <label for="password">Password :</label>

                <div class="input-wrapper">
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        onclick="togglePassword()"
                    >
                        👁
                    </button>
                </div>
            </div>

            <!-- Forgot Password -->
            <div class="forgot">
                <a href="#">Forgot Password?</a>
            </div>

            <!-- Sign In -->
            <button type="submit" class="signin-btn">
                Sign In
            </button>

            <!-- Error -->
            <div id="errorMessage" class="error">
                Invalid email or password.
            </div>

        </form>

        <!-- Sign Up -->
        <div class="signup-text">
            Don't have an account?
            <a href="signup.html">Sign Up</a>
        </div>

    </div>


    <script>

        // Show / Hide Password
        function togglePassword() {

            const password = document.getElementById("password");

            if (password.type === "password") {
                password.type = "text";
            } else {
                password.type = "password";
            }
        }


        // Temporary form handling
        document.getElementById("signinForm").addEventListener("submit", function(event) {

            event.preventDefault();

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            console.log("Email:", email);
            console.log("Password:", password);

            // Later this will connect to Spring Boot API
            alert("Sign In button clicked!");

        });

    </script>

</body>
</html>

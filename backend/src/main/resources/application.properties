server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/dayflow_hrms?createDatabaseIfNotExist=true&useSSL=true&allowPublicKeyRetrieval=false&serverTimezone=UTC&requireSSL=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

spring.jackson.date-format=yyyy-MM-dd
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.indent-output=false

dayflow.jwt.secret=${JWT_SECRET:dayflow-hrms-hackathon-super-secret-key-change-me-1234567890-CHANGE-IN-PRODUCTION}
dayflow.jwt.expiration-ms=${JWT_EXPIRATION:86400000}

dayflow.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict

logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.com.dayflow=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

spring.security.require-ssl=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
# ===== Server =====
server.port=8080

# ===== MySQL =====
# Create the schema first: CREATE DATABASE dayflow_db;
spring.datasource.url=jdbc:mysql://localhost:3306/dayflow_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=changeme
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
# update = auto-create/alter tables from entities, good enough for an 8-hour hackathon
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===== JWT =====
# Hour 3 (M2) reads these two properties in JwtUtil.java
# Replace jwt.secret with a long random string before the demo (never commit real secrets)
jwt.secret=dayflow-hackathon-super-secret-key-change-me-before-demo-123456
jwt.expiration-ms=86400000

# ===== Jackson =====
# Ensures LocalDate/LocalDateTime serialize as ISO-8601 strings, matching the data dictionary (§4)
spring.jackson.serialization.write-dates-as-timestamps=false
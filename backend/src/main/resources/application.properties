# ===============================
# Dayflow HRMS - Application Config
# Owner: M2
# ===============================

# Server
server.port=8080

# ---- MySQL DataSource ----
# Update username/password to match your local MySQL setup.
# Create the schema first: CREATE DATABASE dayflow_hrms;
spring.datasource.url=jdbc:mysql://localhost:3306/dayflow_hrms?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
# update: keeps schema in sync with entities automatically during the hackathon.
# Switch to 'validate' once schema is stable, if time allows.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ---- Jackson (JSON) ----
# Ensures dates serialize as "YYYY-MM-DD" and datetimes as ISO-8601,
# matching the data dictionary contract (§4.7 checklist) with the frontend.
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.serialization.write-dates-as-timestamps=false

# ---- JWT ----
# Shared secret used by security/JwtUtil.java. Replace with a longer,
# securely generated value before any real deployment.
dayflow.jwt.secret=dayflow-hrms-hackathon-super-secret-key-change-me-1234567890
dayflow.jwt.expiration-ms=86400000

# ---- CORS (so React dev server on :5173 can call the API) ----
dayflow.cors.allowed-origins=http://localhost:5173

# ---- Logging ----
logging.level.org.springframework.security=INFO
logging.level.com.dayflow=DEBUG
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/dayflow_hrms?createDatabaseIfNotExist=true&useSSL=true&allowPublicKeyRetrieval=false&serverTimezone=UTC&requireSSL=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

spring.jackson.date-format=yyyy-MM-dd
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.indent-output=false

# ===== Email verification =====
# Set MAIL_ENABLED=true with real SMTP credentials in production.
# For Gmail: MAIL_HOST=smtp.gmail.com, MAIL_PORT=587, and MAIL_PASSWORD must be
# a 16-char App Password (myaccount.google.com/apppasswords). MAIL_FROM must
# equal the authenticated Gmail address.
# When disabled, codes are logged (DEV mode) so signup can still be tested.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

dayflow.mail.enabled=${MAIL_ENABLED:false}
dayflow.mail.from=${MAIL_FROM:no-reply@dayflow.com}

dayflow.verification.code-ttl-minutes=${VERIFICATION_TTL:15}

dayflow.jwt.secret=${JWT_SECRET:dayflow-hrms-hackathon-super-secret-key-change-me-1234567890-CHANGE-IN-PRODUCTION}
dayflow.jwt.expiration-ms=${JWT_EXPIRATION:86400000}

dayflow.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict

logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.com.dayflow=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

spring.security.require-ssl=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
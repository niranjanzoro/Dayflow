# ---- Observability & Logging ----
# Application logging configuration
logging.config=classpath:logback-spring.xml

# Log Levels
logging.level.root=WARN
logging.level.com.dayflow=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=INFO
logging.level.org.springframework.boot.actuate=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# Actuator (Monitoring & Metrics)
management.endpoints.web.exposure.include=health,metrics,info,prometheus
management.endpoints.web.base-path=/api/actuator
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=when-authorized
management.endpoint.health.probes.enabled=true
management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.system=true
management.metrics.tags.application=dayflow-hrms
management.metrics.tags.environment=${ENVIRONMENT:development}

# Health Checks
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
server.servlet.context-path=/

# Application Info
spring.application.name=dayflow-hrms
application.version=0.0.1-SNAPSHOT
application.description=Dayflow HRMS - Hackathon Backend

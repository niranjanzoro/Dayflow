<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />    <!-- SECURITY: Content Security Policy -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' http://localhost:8080; frame-ancestors 'none';" />
    <!-- SECURITY: Prevent MIME type sniffing -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <!-- SECURITY: Prevent clickjacking -->
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <!-- SECURITY: XSS Protection -->
    <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
    <!-- SECURITY: Referrer Policy -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!-- Apply saved theme before first paint to avoid a flash of the wrong theme -->
    <script>
      try {
        var t = localStorage.getItem('dayflow_theme')
          || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <title>Dayflow HRMS</title>
    <meta name="description" content="Dayflow HRMS - attendance, leave and payroll for your whole team. HR and employees, one dashboard." />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F3F5F9" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0D141F" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
